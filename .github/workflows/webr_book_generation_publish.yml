name: Web-R Book Verified Generation Publisher

on:
  workflow_call:
    secrets:
      STATGROUND_SQL_READ_TOKEN:
        required: true
      WEBR_BOOK_PUBLISHER_ENDPOINT:
        required: true
      WEBR_BOOK_PUBLISHER_USER:
        required: true
      WEBR_BOOK_PUBLISHER_PASSWORD:
        required: true
      WEBR_BOOK_PUBLISHER_CA_PEM:
        required: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable Statground SQL publisher
        uses: actions/checkout@v6
        with:
          repository: statground/Statground_SQL
          ref: 27cbfecbb883c6c834ae2c58be74dad47c690b4d
          token: ${{ secrets.STATGROUND_SQL_READ_TOKEN }}
          path: .publisher/statground-sql
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: docker-compose/50005_Clickhouse_Statground/webr_book_generation_publisher.py
          sparse-checkout-cone-mode: false

      - name: Publish verified Web-R Book generation
        env:
          PUBLISHER_ENDPOINT: ${{ secrets.WEBR_BOOK_PUBLISHER_ENDPOINT }}
          PUBLISHER_USER: ${{ secrets.WEBR_BOOK_PUBLISHER_USER }}
          PUBLISHER_PASSWORD: ${{ secrets.WEBR_BOOK_PUBLISHER_PASSWORD }}
          PUBLISHER_CA_PEM: ${{ secrets.WEBR_BOOK_PUBLISHER_CA_PEM }}
        run: |
          set -euo pipefail
          umask 077

          readonly expected_sql_commit="27cbfecbb883c6c834ae2c58be74dad47c690b4d"
          readonly sql_root="$GITHUB_WORKSPACE/.publisher/statground-sql"
          readonly publisher="$sql_root/docker-compose/50005_Clickhouse_Statground/webr_book_generation_publisher.py"
          readonly publisher_config="$RUNNER_TEMP/webr-book-generation-publisher-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          readonly publisher_ca="$RUNNER_TEMP/webr-book-generation-publisher-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.ca.pem"
          trap 'rm -f -- "$publisher_config" "$publisher_ca"' EXIT

          test "$(git -C "$sql_root" rev-parse HEAD)" = "$expected_sql_commit" || {
            echo "::error::Pinned Statground SQL publisher commit mismatch"
            exit 1
          }
          test -f "$publisher" || {
            echo "::error::Pinned Web-R Book generation publisher is missing"
            exit 1
          }
          test -n "$PUBLISHER_ENDPOINT" || {
            echo "::error::WEBR_BOOK_PUBLISHER_ENDPOINT secret is required"
            exit 1
          }
          test -n "$PUBLISHER_USER" || {
            echo "::error::WEBR_BOOK_PUBLISHER_USER secret is required"
            exit 1
          }
          test -n "$PUBLISHER_PASSWORD" || {
            echo "::error::WEBR_BOOK_PUBLISHER_PASSWORD secret is required"
            exit 1
          }

          PUBLISHER_CONFIG="$publisher_config" PUBLISHER_CA="$publisher_ca" python3 - <<'PY'
          import json
          import os

          endpoint = os.environ["PUBLISHER_ENDPOINT"]
          user = os.environ["PUBLISHER_USER"]
          password = os.environ["PUBLISHER_PASSWORD"]
          ca_pem = os.environ.get("PUBLISHER_CA_PEM", "")
          config_path = os.environ["PUBLISHER_CONFIG"]
          ca_path = os.environ["PUBLISHER_CA"]

          if user != "webr_book_generation_publisher":
              raise SystemExit("WEBR Book generation publisher principal is invalid")

          flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
          flags |= getattr(os, "O_CLOEXEC", 0) | getattr(os, "O_NOFOLLOW", 0)
          if ca_pem:
              ca_fd = os.open(ca_path, flags, 0o600)
              with os.fdopen(ca_fd, "w", encoding="utf-8") as handle:
                  handle.write(ca_pem)
                  handle.flush()
                  os.fsync(handle.fileno())

          config = {
              "endpoint": endpoint,
              "user": user,
              "password": password,
              "tls": {"verify": True, "ca_file": ca_path if ca_pem else None},
          }
          config_fd = os.open(config_path, flags, 0o600)
          with os.fdopen(config_fd, "w", encoding="utf-8") as handle:
              json.dump(config, handle, ensure_ascii=True, sort_keys=True)
              handle.write("\n")
              handle.flush()
              os.fsync(handle.fileno())
          PY

          unset PUBLISHER_ENDPOINT PUBLISHER_USER PUBLISHER_PASSWORD PUBLISHER_CA_PEM
          python3 "$publisher" \
            --transport http \
            --config "$publisher_config" \
            --timeout-seconds 120 \
            publish
