name: Verify bounded dictionary Book discovery once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/book_keyword_discovery_verify_once.yml

permissions:
  contents: read

concurrency:
  group: statground-book-provider-schedule
  cancel-in-progress: false
  queue: max

jobs:
  verify_launch:
    if: >-
      github.repository == 'statground/Statground_Data_NAVER_Book' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'Verify dictionary Book discovery once after cache recovery 20261003-a7b61732'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Require the reviewed base and this single harness change
        run: |
          python3 - <<'PY'
          import subprocess

          expected_base = '461c5e76c430e6908023e49bcbe1086b7ab997d0'
          expected_path = '.github/workflows/book_keyword_discovery_verify_once.yml'
          base = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          paths = subprocess.check_output(['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], text=True).splitlines()
          if base != expected_base or paths != [expected_path]:
              raise SystemExit('One-time Book launch does not match the reviewed base and exact harness path')
          PY

  collect_and_publish:
    needs: verify_launch
    uses: ./.github/workflows/kakao_book_collect.yml
    with:
      run_kind: manual
      mode: manual
      queries: '통계학;언어학'
      lexicon_enabled: true
      discovery_keyword_limit: 2
      sort: latest
      page_cap: 1
      page_size: 10
      dry_run: false
      respect_frontier_due: false
      schedule_enabled: false
      auto_daily_budget: 2000
    secrets:
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST || secrets.CH_HOST }}
      CLICKHOUSE_PORT: ${{ secrets.CLICKHOUSE_PORT || secrets.CH_PORT }}
      CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER || secrets.CH_USER }}
      CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD || secrets.CH_PASSWORD }}
      CLICKHOUSE_HTTP_URL_PATH: ${{ secrets.CLICKHOUSE_HTTP_URL_PATH || secrets.CH_HTTP_URL_PATH }}
      STATGROUND_SQL_READ_TOKEN: ${{ secrets.STATGROUND_SQL_READ_TOKEN }}
      BOOK_SERVING_COORDINATOR_ENDPOINT: ${{ secrets.BOOK_SERVING_COORDINATOR_ENDPOINT }}
      WEBR_BOOK_SERVING_PUBLISHER_PASSWORD: ${{ secrets.WEBR_BOOK_SERVING_PUBLISHER_PASSWORD }}
      MIRTYPE_BOOK_SERVING_PUBLISHER_PASSWORD: ${{ secrets.MIRTYPE_BOOK_SERVING_PUBLISHER_PASSWORD }}
      STATGROUND_PROVIDER_BOOK_SERVING_PUBLISHER_PASSWORD: ${{ secrets.STATGROUND_PROVIDER_BOOK_SERVING_PUBLISHER_PASSWORD }}
      BOOK_SERVING_NAVER_OUTBOX_ENDPOINT: ${{ secrets.BOOK_SERVING_NAVER_OUTBOX_ENDPOINT }}
      BOOK_SERVING_KAKAO_OUTBOX_ENDPOINT: ${{ secrets.BOOK_SERVING_KAKAO_OUTBOX_ENDPOINT }}
      BOOK_SERVING_OUTBOX_OBSERVER_PASSWORD: ${{ secrets.BOOK_SERVING_OUTBOX_OBSERVER_PASSWORD }}
      BOOK_SERVING_CA_PEM: ${{ secrets.BOOK_SERVING_CA_PEM }}
