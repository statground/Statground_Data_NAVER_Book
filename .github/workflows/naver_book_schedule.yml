name: NAVER Book Manual Rollback Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The manual NAVER rollback path and the scheduled Kakao collector still
  # share ClickHouse serving sources, so never let the two providers overlap.
  group: statground-book-provider-schedule
  cancel-in-progress: false

jobs:
  seed:
    name: Publisher seed
    uses: ./.github/workflows/naver_book_collect_all.yml
    with:
      stage: seed
    secrets: inherit

  discovery:
    name: Author and keyword discovery
    needs: seed
    uses: ./.github/workflows/naver_book_collect_all.yml
    with:
      stage: discovery
    secrets: inherit

  catalog:
    name: Publisher and R package catalog
    needs: discovery
    uses: ./.github/workflows/naver_book_collect_all.yml
    with:
      stage: catalog
    secrets: inherit

  refresh:
    name: Serving refresh
    needs: catalog
    uses: ./.github/workflows/naver_book_collect_all.yml
    with:
      stage: refresh
    secrets: inherit
