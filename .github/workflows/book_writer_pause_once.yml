name: Pause four Book writer workflows once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/book_writer_pause_once.yml

permissions:
  actions: write

jobs:
  disable_exact_book_writers:
    if: ${{ github.repository == 'statground/Statground_Data_NAVER_Book' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Disable and verify the four exact Book writer workflows
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repo = 'statground/Statground_Data_NAVER_Book'
          if os.environ.get('GITHUB_REPOSITORY') != repo or os.environ.get('GITHUB_REF') != 'refs/heads/main':
              raise SystemExit('Unexpected repository or ref')
          token = os.environ.get('GH_TOKEN', '')
          if not token:
              raise SystemExit('Actions write token is unavailable')
          workflows = {
              271467207: 'naver_book_collect_all.yml',
              311277246: 'naver_book_schedule.yml',
              320611761: 'kakao_book_collect.yml',
              320611762: 'kakao_book_schedule.yml',
          }
          base = 'https://api.github.com/repos/' + repo + '/actions/workflows/'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': 'Bearer ' + token,
              'User-Agent': 'statground-book-writer-pause-once',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, new_url):
                  raise SystemExit('Unexpected workflow API redirect')

          opener = urllib.request.build_opener(NoRedirect())

          def request(path, method='GET'):
              req = urllib.request.Request(base + path, headers=headers, method=method,
                                           data=b'' if method == 'PUT' else None)
              try:
                  with opener.open(req, timeout=15) as response:
                      body = response.read(65537)
                      if len(body) > 65536:
                          raise SystemExit('Workflow response exceeds bound')
                      return response.status, json.loads(body) if body else None
              except urllib.error.HTTPError as error:
                  raise SystemExit(f'GitHub workflow API returned HTTP {error.code} for {path}') from None

          states = {}
          for workflow_id, filename in workflows.items():
              status, current = request(str(workflow_id))
              if status != 200 or not isinstance(current, dict) or current.get('id') != workflow_id or not current.get('path', '').endswith('/' + filename):
                  raise SystemExit(f'Workflow identity mismatch: {workflow_id}')
              if current.get('state') not in ('active', 'disabled_manually'):
                  raise SystemExit(f'Unexpected workflow state: {workflow_id}')
              states[workflow_id] = current['state']

          for workflow_id in workflows:
              if states[workflow_id] == 'active':
                  status, _ = request(str(workflow_id) + '/disable', 'PUT')
                  if status != 204:
                      raise SystemExit(f'Disable did not return HTTP 204: {workflow_id}')
              for attempt in range(5):
                  status, current = request(str(workflow_id))
                  if status == 200 and current.get('id') == workflow_id and current.get('state') == 'disabled_manually':
                      break
                  time.sleep(1)
              else:
                  raise SystemExit(f'Workflow did not become disabled_manually: {workflow_id}')
              print(f'book_writer_paused workflow_id={workflow_id} state=disabled_manually')
          PY
