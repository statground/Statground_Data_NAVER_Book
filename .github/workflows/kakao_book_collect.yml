name: Kakao Book Collector - Provider Direct DB

on:
  workflow_call:
    inputs:
      run_kind:
        description: "manual or scheduled"
        required: false
        type: string
        default: "manual"
      mode:
        description: "Collection evidence mode"
        required: false
        type: string
        default: "manual"
      queries:
        description: "Semicolon/newline-delimited queries; values are never printed"
        required: true
        type: string
      sort:
        required: false
        type: string
        default: "accuracy"
      target:
        required: false
        type: string
        default: ""
      page_cap:
        required: false
        type: number
        default: 1
      page_size:
        required: false
        type: number
        default: 50
      dry_run:
        required: false
        type: boolean
        default: false
      respect_frontier_due:
        required: false
        type: boolean
        default: false
      schedule_enabled:
        required: false
        type: boolean
        default: false
      auto_daily_budget:
        required: false
        type: number
        default: 2000
    secrets:
      KAKAO_REST_API_KEY:
        required: true
      CLICKHOUSE_HOST:
        required: true
      CLICKHOUSE_PORT:
        required: false
      CLICKHOUSE_USER:
        required: true
      CLICKHOUSE_PASSWORD:
        required: true
      CLICKHOUSE_HTTP_URL_PATH:
        required: false
  workflow_dispatch:
    inputs:
      mode:
        description: "Collection evidence mode"
        required: false
        default: "manual"
      queries:
        description: "Semicolon/newline-delimited queries; values are never printed"
        required: true
        default: "통계학"
      sort:
        type: choice
        options: [accuracy, latest]
        default: accuracy
      target:
        description: "Optional Kakao search target: title, isbn, publisher, or person"
        type: string
        default: ""
      page_cap:
        type: number
        default: 1
      page_size:
        type: number
        default: 50
      dry_run:
        type: boolean
        default: false
      respect_frontier_due:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: statground-kakao-book-api
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Port 50005 is the durable direct S1_R1 endpoint, never the 50006 gateway.
      CLICKHOUSE_DIRECT_ENDPOINT_HOSTNAME: clickhouse-s1-r1
      KAKAO_RUN_KIND: ${{ inputs.run_kind || 'manual' }}
      KAKAO_COLLECT_MODE: ${{ inputs.mode || 'manual' }}
      KAKAO_QUERIES: ${{ inputs.queries }}
      KAKAO_SEARCH_SORT: ${{ inputs.sort || 'accuracy' }}
      KAKAO_SEARCH_TARGET: ${{ inputs.target || '' }}
      KAKAO_PAGE_CAP: ${{ inputs.page_cap || 1 }}
      KAKAO_PAGE_SIZE: ${{ inputs.page_size || 50 }}
      KAKAO_DRY_RUN: ${{ inputs.dry_run || false }}
      KAKAO_RESPECT_FRONTIER_DUE: ${{ inputs.respect_frontier_due || false }}
      KAKAO_BOOK_SCHEDULE_ENABLED: ${{ inputs.schedule_enabled || false }}
      KAKAO_BOOK_OFFICIAL_DAILY_LIMIT: "30000"
      KAKAO_BOOK_AUTO_DAILY_BUDGET: ${{ inputs.auto_daily_budget || 2000 }}
      KAKAO_BOOK_MANUAL_DAILY_RESERVE: "4000"
      KAKAO_BOOK_DAUM_SEARCH_SHARED_RESERVE: "8000"
      KAKAO_BOOK_EMERGENCY_RESERVE: "6000"
      KAKAO_MAX_REQUESTS_PER_RUN: "2000"
      KAKAO_QUOTA_EXHAUSTED_HOLD_HOURS: "24"
      KAKAO_RATE_LIMIT_HOLD_MINUTES: "30"
      KAKAO_REQUIRE_CLICKHOUSE_HTTPS: "true"
      KAKAO_API_TIMEOUT_SECONDS: "20"
      KAKAO_API_ATTEMPTS: "3"
      KAKAO_API_BACKOFF_MIN: "0.5"
      KAKAO_API_BACKOFF_MAX: "4.0"
      KAKAO_MAX_WORKERS: "1"
      KAKAO_CLICKHOUSE_RAW_WRITE_TIMEOUT_SECONDS: "660"
      CLICKHOUSE_PREFLIGHT_RETRY_BUDGET_SECONDS: "90"
      CLICKHOUSE_PREFLIGHT_RETRY_BACKOFF_SECONDS: "5"
      KAKAO_OUTBOX_REPLAY_LIMIT: "25"
      KAKAO_OUTBOX_MAX_REPLICA_QUEUE: "1000"
      KAKAO_OUTBOX_MAX_REPLICA_DELAY_SECONDS: "900"
      CLICKHOUSE_PRESSURE_GATE_MIN_AVAILABLE_BYTES: "107374182400"
      CLICKHOUSE_PRESSURE_GATE_MAX_USED_RATIO: "0.90"
      CLICKHOUSE_PRESSURE_GATE_MIN_AVAILABLE_INODES: "1000000"
      CLICKHOUSE_PRESSURE_GATE_MAX_USED_INODE_RATIO: "0.95"
      CLICKHOUSE_PRESSURE_GATE_MAX_DISTRIBUTED_FILES: "10000"
      CLICKHOUSE_PRESSURE_GATE_MAX_REPLICA_QUEUE: "2000"
      CLICKHOUSE_PRESSURE_GATE_MAX_REPLICA_DELAY_SECONDS: "900"
      CLICKHOUSE_PRESSURE_GATE_MAX_IOWAIT_NORMALIZED: "0.50"
      CLICKHOUSE_PRESSURE_GATE_TIMEOUT_SECONDS: "15"
      PRODUCER_SOURCE: "github_actions"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run secret-free tests and build
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          go mod download all
          go mod verify
          go test -mod=mod ./...
          go build -mod=mod ./cmd/collect_kakao

      - name: Validate Kakao API key
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: |
          test -n "$KAKAO_REST_API_KEY" || { echo "KAKAO_REST_API_KEY secret is required"; exit 1; }

      - name: Validate ClickHouse endpoint
        env:
          CH_HOST: ${{ secrets.CLICKHOUSE_HOST }}
        run: |
          test -n "$CH_HOST" || { echo "CLICKHOUSE_HOST secret is required"; exit 1; }
          test -n "$CLICKHOUSE_DIRECT_ENDPOINT_HOSTNAME" || { echo "CLICKHOUSE_DIRECT_ENDPOINT_HOSTNAME variable or secret is required"; exit 1; }
          case "$CH_HOST" in
            127.0.0.1|localhost|0.0.0.0|::1|[::1])
              echo "ClickHouse host must be externally reachable"
              exit 1
              ;;
          esac
          python3 - <<'PY'
          import os
          import re

          expected = os.environ.get("CLICKHOUSE_DIRECT_ENDPOINT_HOSTNAME", "")
          if not re.fullmatch(r"[A-Za-z0-9](?:[A-Za-z0-9._-]{0,251}[A-Za-z0-9])?", expected):
              raise SystemExit("CLICKHOUSE_DIRECT_ENDPOINT_HOSTNAME must identify one physical ClickHouse node")
          if "gateway" in expected.lower():
              raise SystemExit("CLICKHOUSE_DIRECT_ENDPOINT_HOSTNAME must not identify a load-balancing gateway")
          PY

      - name: Resolve ClickHouse approved transport contract
        id: clickhouse_transport
        env:
          CH_HOST: ${{ secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CLICKHOUSE_PORT || '443' }}
          CH_HTTP_URL_PATH: ${{ secrets.CLICKHOUSE_HTTP_URL_PATH }}
        run: |
          case "$CH_HOST" in
            *://*) echo "::error::ClickHouse host must be a hostname without a URL scheme"; exit 1 ;;
          esac
          case "$CH_PORT" in
            ''|*[!0-9]*) echo "::error::ClickHouse port must be an integer"; exit 1 ;;
          esac
          test "$CH_PORT" -ge 1 && test "$CH_PORT" -le 65535 || { echo "::error::ClickHouse port is outside the valid range"; exit 1; }
          test -z "$CH_HTTP_URL_PATH" || { echo "::error::ClickHouse endpoint path must be empty"; exit 1; }

          host_kind="$(python3 - <<'PY'
          import ipaddress
          import os

          host = os.environ["CH_HOST"].strip()
          candidate = host[1:-1] if host.startswith("[") and host.endswith("]") else host
          try:
              ipaddress.ip_address(candidate)
          except ValueError:
              print("hostname")
          else:
              print("ip")
          PY
          )"

          if [ "$host_kind" = "ip" ]; then
            test "$CH_PORT" != "443" || { echo "::error::Approved ClickHouse IP/HTTP endpoint requires its explicit non-TLS port"; exit 1; }
            echo "protocol=http" >> "$GITHUB_OUTPUT"
            echo "::warning::Approved legacy ClickHouse IP/HTTP transport is active; credentials and payloads are not TLS-protected"
          else
            test "$CH_PORT" = "443" || { echo "::error::ClickHouse hostname/HTTPS endpoint requires port 443"; exit 1; }
            echo "protocol=https" >> "$GITHUB_OUTPUT"
          fi
          echo "port=$CH_PORT" >> "$GITHUB_OUTPUT"

      - name: Validate ClickHouse credentials
        env:
          CH_USER: ${{ secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
        run: |
          test -n "$CH_USER" || { echo "CLICKHOUSE_USER secret is required"; exit 1; }
          test -n "$CH_PASSWORD" || { echo "CLICKHOUSE_PASSWORD secret is required"; exit 1; }

      - name: Gate ClickHouse writes on storage pressure
        env:
          CLICKHOUSE_PRESSURE_GATE_TARGETS: >-
            replica:Data_Book_KAKAO_Raw.kakao_book_raw_local,
            replica:Data_Book_KAKAO_Log.kakao_collect_log_local,
            replica:Data_Book_KAKAO_Log.kakao_api_call_log_local,
            replica:Data_Book_KAKAO_Log.kakao_query_frontier_local,
            replica:Data_Book_Service.book_provider_latest_local,
            replica:Data_Book_Service.book_recent_local,
            replica:Data_Book_Service.book_isbn_alias_local,
            replica:Data_Book_Service.book_catalog_latest_local,
            replica:webr_book.naver_r_book_catalog_local,
            replica:mirtype_book.naver_language_book_catalog_local,
            local:Data_Book_KAKAO_Log.kakao_direct_insert_outbox
          CH_HOST: ${{ secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ steps.clickhouse_transport.outputs.port }}
          CH_USER: ${{ secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          CH_PROTOCOL: ${{ steps.clickhouse_transport.outputs.protocol }}
          CH_HTTP_URL_PATH: ${{ secrets.CLICKHOUSE_HTTP_URL_PATH }}
        run: python3 scripts/clickhouse_pressure_gate.py

      - name: Collect Kakao books into provider tables
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REQUIRE_CLICKHOUSE_HTTPS: "false"
          CH_HOST: ${{ secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ steps.clickhouse_transport.outputs.port }}
          CH_USER: ${{ secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          CH_PROTOCOL: ${{ steps.clickhouse_transport.outputs.protocol }}
          CH_HTTP_URL_PATH: ${{ secrets.CLICKHOUSE_HTTP_URL_PATH }}
          CH_DATABASE: Data_Book_KAKAO_Raw
        run: go run -mod=mod ./cmd/collect_kakao

      - name: Refresh provider-neutral serving catalogs for manual runs
        if: ${{ inputs.dry_run != true && inputs.run_kind != 'scheduled' }}
        env:
          CH_HOST: ${{ secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ steps.clickhouse_transport.outputs.port }}
          CH_USER: ${{ secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          CH_PROTOCOL: ${{ steps.clickhouse_transport.outputs.protocol }}
          CH_HTTP_URL_PATH: ${{ secrets.CLICKHOUSE_HTTP_URL_PATH }}
          CH_DATABASE: Data_Book_Service
          BOOK_PROVIDER_REFRESH_VIEW: Data_Book_Service.mv_book_catalog_latest_refresh
          BOOK_PROVIDER_COUNT_VIEW: Data_Book_Service.v_book_catalog_latest_current
          WEBR_BOOK_REFRESH_VIEW: webr_book.mv_naver_r_book_catalog_refresh
          WEBR_BOOK_COUNT_VIEW: webr_book.v_naver_r_book_catalog
          MIRTYPE_BOOK_REFRESH_ENABLED: "true"
          MIRTYPE_BOOK_REFRESH_VIEW: mirtype_book.mv_naver_language_book_catalog_refresh
          MIRTYPE_BOOK_COUNT_VIEW: mirtype_book.v_naver_language_book_catalog
          WEBR_BOOK_REFRESH_SETTLE_SECONDS: "5"
          WEBR_BOOK_REFRESH_TIMEOUT_SECONDS: "900"
          BOOK_REFRESH_COORDINATOR_ATTEMPTS: "12"
          BOOK_REFRESH_COORDINATOR_RETRY_MILLISECONDS: "500"
        run: go run -mod=mod ./cmd/refresh_webr_book_catalog
