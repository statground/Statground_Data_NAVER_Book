name: Kakao Book Collector - Provider Direct DB

on:
  workflow_call:
    inputs:
      run_kind:
        description: "manual or scheduled"
        required: false
        type: string
        default: "manual"
      mode:
        description: "Collection evidence mode"
        required: false
        type: string
        default: "manual"
      queries:
        description: "Semicolon/newline-delimited queries; values are never printed"
        required: true
        type: string
      sort:
        required: false
        type: string
        default: "accuracy"
      target:
        required: false
        type: string
        default: ""
      page_cap:
        required: false
        type: number
        default: 1
      page_size:
        required: false
        type: number
        default: 50
      dry_run:
        required: false
        type: boolean
        default: false
      respect_frontier_due:
        required: false
        type: boolean
        default: false
      schedule_enabled:
        required: false
        type: boolean
        default: false
      auto_daily_budget:
        required: false
        type: number
        default: 2000
    secrets:
      KAKAO_REST_API_KEY:
        required: true
      CLICKHOUSE_HOST:
        required: true
      CLICKHOUSE_PORT:
        required: false
      CLICKHOUSE_USER:
        required: true
      CLICKHOUSE_PASSWORD:
        required: true
      CLICKHOUSE_PROTOCOL:
        required: false
      CLICKHOUSE_HTTP_URL_PATH:
        required: false
  workflow_dispatch:
    inputs:
      mode:
        description: "Collection evidence mode"
        required: false
        default: "manual"
      queries:
        description: "Semicolon/newline-delimited queries; values are never printed"
        required: true
        default: "통계학"
      sort:
        type: choice
        options: [accuracy, latest]
        default: accuracy
      target:
        description: "Optional Kakao search target: title, isbn, publisher, or person"
        type: string
        default: ""
      page_cap:
        type: number
        default: 1
      page_size:
        type: number
        default: 50
      dry_run:
        type: boolean
        default: false
      respect_frontier_due:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: statground-kakao-book-api
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KAKAO_RUN_KIND: ${{ inputs.run_kind || 'manual' }}
      KAKAO_COLLECT_MODE: ${{ inputs.mode || 'manual' }}
      KAKAO_QUERIES: ${{ inputs.queries }}
      KAKAO_SEARCH_SORT: ${{ inputs.sort || 'accuracy' }}
      KAKAO_SEARCH_TARGET: ${{ inputs.target || '' }}
      KAKAO_PAGE_CAP: ${{ inputs.page_cap || 1 }}
      KAKAO_PAGE_SIZE: ${{ inputs.page_size || 50 }}
      KAKAO_DRY_RUN: ${{ inputs.dry_run || false }}
      KAKAO_RESPECT_FRONTIER_DUE: ${{ inputs.respect_frontier_due || false }}
      KAKAO_BOOK_SCHEDULE_ENABLED: ${{ inputs.schedule_enabled || false }}
      KAKAO_BOOK_OFFICIAL_DAILY_LIMIT: "30000"
      KAKAO_BOOK_AUTO_DAILY_BUDGET: ${{ inputs.auto_daily_budget || 2000 }}
      KAKAO_BOOK_MANUAL_DAILY_RESERVE: "4000"
      KAKAO_BOOK_DAUM_SEARCH_SHARED_RESERVE: "8000"
      KAKAO_BOOK_EMERGENCY_RESERVE: "6000"
      KAKAO_MAX_REQUESTS_PER_RUN: "2000"
      KAKAO_QUOTA_EXHAUSTED_HOLD_HOURS: "24"
      KAKAO_RATE_LIMIT_HOLD_MINUTES: "30"
      KAKAO_REQUIRE_CLICKHOUSE_HTTPS: "true"
      KAKAO_API_TIMEOUT_SECONDS: "20"
      KAKAO_API_ATTEMPTS: "3"
      KAKAO_API_BACKOFF_MIN: "0.5"
      KAKAO_API_BACKOFF_MAX: "4.0"
      KAKAO_MAX_WORKERS: "1"
      PRODUCER_SOURCE: "github_actions"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run secret-free tests and build
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          go mod download all
          go mod verify
          go test -mod=mod ./...
          go build -mod=mod ./cmd/collect_kakao

      - name: Validate Kakao API key
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: |
          test -n "$KAKAO_REST_API_KEY" || { echo "KAKAO_REST_API_KEY secret is required"; exit 1; }

      - name: Validate ClickHouse endpoint
        env:
          CH_HOST: ${{ secrets.CLICKHOUSE_HOST }}
        run: |
          test -n "$CH_HOST" || { echo "CLICKHOUSE_HOST secret is required"; exit 1; }
          case "$CH_HOST" in
            127.0.0.1|localhost|0.0.0.0|::1|[::1])
              echo "ClickHouse host must be externally reachable"
              exit 1
              ;;
          esac

      - name: Validate ClickHouse TLS endpoint contract
        env:
          CH_HOST: ${{ secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CLICKHOUSE_PORT || '443' }}
          CH_PROTOCOL: ${{ secrets.CLICKHOUSE_PROTOCOL || 'https' }}
          CH_HTTP_URL_PATH: ${{ secrets.CLICKHOUSE_HTTP_URL_PATH }}
        run: |
          normalized_protocol="$(printf '%s' "$CH_PROTOCOL" | tr '[:upper:]' '[:lower:]')"
          case "$CH_HOST" in
            *://*) echo "::error::ClickHouse host must be a hostname without a URL scheme"; exit 1 ;;
          esac
          case "$CH_HOST" in
            *:* ) echo "::error::ClickHouse TLS endpoint must use a certificate hostname instead of an IP address"; exit 1 ;;
            *[!0-9.]* ) ;;
            * ) echo "::error::ClickHouse TLS endpoint must use a certificate hostname instead of an IP address"; exit 1 ;;
          esac
          test "$normalized_protocol" = "https" || { echo "::error::ClickHouse TLS protocol is required"; exit 1; }
          test "$CH_PORT" = "443" || { echo "::error::ClickHouse TLS endpoint must use port 443"; exit 1; }
          test -z "$CH_HTTP_URL_PATH" || { echo "::error::ClickHouse TLS endpoint path must be empty"; exit 1; }

      - name: Validate ClickHouse credentials
        env:
          CH_USER: ${{ secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
        run: |
          test -n "$CH_USER" || { echo "CLICKHOUSE_USER secret is required"; exit 1; }
          test -n "$CH_PASSWORD" || { echo "CLICKHOUSE_PASSWORD secret is required"; exit 1; }

      - name: Collect Kakao books into provider tables
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          CH_HOST: ${{ secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CLICKHOUSE_PORT || '8123' }}
          CH_USER: ${{ secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          CH_PROTOCOL: ${{ secrets.CLICKHOUSE_PROTOCOL || 'https' }}
          CH_HTTP_URL_PATH: ${{ secrets.CLICKHOUSE_HTTP_URL_PATH }}
          CH_DATABASE: Data_Book_KAKAO_Raw
        run: go run -mod=mod ./cmd/collect_kakao

      - name: Refresh provider-neutral serving catalogs for manual runs
        if: ${{ inputs.dry_run != true && inputs.run_kind != 'scheduled' }}
        env:
          CH_HOST: ${{ secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CLICKHOUSE_PORT || '8123' }}
          CH_USER: ${{ secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          CH_PROTOCOL: ${{ secrets.CLICKHOUSE_PROTOCOL || 'https' }}
          CH_HTTP_URL_PATH: ${{ secrets.CLICKHOUSE_HTTP_URL_PATH }}
          CH_DATABASE: Data_Book_Service
          BOOK_PROVIDER_REFRESH_VIEW: Data_Book_Service.mv_book_catalog_latest_refresh
          BOOK_PROVIDER_COUNT_VIEW: Data_Book_Service.v_book_catalog_latest_current
          WEBR_BOOK_REFRESH_VIEW: webr_book.mv_naver_r_book_catalog_refresh
          WEBR_BOOK_COUNT_VIEW: webr_book.v_naver_r_book_catalog
          MIRTYPE_BOOK_REFRESH_ENABLED: "true"
          MIRTYPE_BOOK_REFRESH_VIEW: mirtype_book.mv_naver_language_book_catalog_refresh
          MIRTYPE_BOOK_COUNT_VIEW: mirtype_book.v_naver_language_book_catalog
          WEBR_BOOK_REFRESH_SETTLE_SECONDS: "5"
          WEBR_BOOK_REFRESH_TIMEOUT_SECONDS: "900"
          BOOK_REFRESH_COORDINATOR_ATTEMPTS: "12"
          BOOK_REFRESH_COORDINATOR_RETRY_MILLISECONDS: "500"
        run: go run -mod=mod ./cmd/refresh_webr_book_catalog
