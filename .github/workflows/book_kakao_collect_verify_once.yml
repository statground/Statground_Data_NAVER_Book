name: Verify bounded Kakao Book intake once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/book_kakao_collect_verify_once.yml

permissions:
  contents: read

concurrency:
  group: statground-book-provider-schedule
  cancel-in-progress: false
  queue: max

jobs:
  verify_bounded_intake:
    if: >-
      github.repository == 'statground/Statground_Data_NAVER_Book' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.KAKAO_BOOK_SCHEDULE_ENABLED != 'false' &&
      vars.BOOK_SERVING_GENERATION_PUBLISH_ENABLED != 'true' &&
      vars.WEBR_BOOK_GENERATION_PUBLISH_ENABLED != 'true'
    uses: ./.github/workflows/kakao_book_collect.yml
    with:
      run_kind: scheduled
      mode: fixed_keyword
      queries: ${{ vars.KAKAO_BOOK_DISCOVERY_QUERIES || '통계학;R 프로그래밍;외국어 학습;언어 학습' }}
      sort: latest
      page_cap: 1
      page_size: 50
      dry_run: false
      respect_frontier_due: true
      schedule_enabled: ${{ vars.KAKAO_BOOK_SCHEDULE_ENABLED != 'false' }}
      auto_daily_budget: 2000
    secrets:
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST || secrets.CH_HOST }}
      CLICKHOUSE_PORT: ${{ secrets.CLICKHOUSE_PORT || secrets.CH_PORT }}
      CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER || secrets.CH_USER }}
      CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD || secrets.CH_PASSWORD }}
      CLICKHOUSE_HTTP_URL_PATH: ${{ secrets.CLICKHOUSE_HTTP_URL_PATH || secrets.CH_HTTP_URL_PATH }}
      STATGROUND_SQL_READ_TOKEN: ${{ secrets.STATGROUND_SQL_READ_TOKEN }}
