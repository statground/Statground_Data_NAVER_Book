name: Book Provider Contract Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: statground-book-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate provider contracts without secrets
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          go mod download all
          go mod verify
          go test -mod=mod ./...
          go vet ./...

      - name: Verify dry-run planner performs no external calls
        run: go run -mod=mod ./cmd/plan_kakao_book_requests

      - name: Validate pressure-gate and workflow contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest scripts/test_clickhouse_pressure_gate.py scripts/test_book_serving_readonly_preflight.py

      - name: Set up Go for actionlint
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: false

      - name: Validate workflow syntax
        # actionlint 1.7.11 predates GitHub's concurrency.queue key. Ignore only
        # that known schema lag while retaining every other workflow check.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11 -ignore 'unexpected key "queue" for "concurrency" section' -shellcheck= -pyflakes= -format '{{json .}}' .github/workflows/*.yml
